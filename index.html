<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arena | Moda Fitness</title>
  <meta name="description" content="Arena: camisas, shorts, calças, tênis e acessórios de treino com envio para a sua região.">
  <meta name="theme-color" content="#121212">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23121212'/%3E%3Cpath d='M32 10 12 54h9l4-10h14l4 10h9L32 10Zm0 18 5 12H27l5-12Z' fill='%23B4FF39'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- CSS crítico embutido: garante o tema escuro e o aviso de Termos mesmo se styles.css não carregar -->
  <style>
    :root{--bg:#121212;--surface:#1E1E1E;--border:#2C2C2C;--text:#FFFFFF;--muted:#A9A9A9;--accent:#B4FF39;--accent-ink:#121212;--radius:4px;--font-body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--font-head:'Barlow Condensed','Arial Narrow',Impact,sans-serif}
    *,*::before,*::after{box-sizing:border-box}
    [hidden]{display:none!important}
    html{background:#121212;color-scheme:dark}
    body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:16px;line-height:1.5}
    body.gated{overflow:hidden}
    img{max-width:100%;display:block}
    a{color:inherit;text-decoration:none}
    button,input{font:inherit;color:inherit}
    h1,h2,h3{font-family:var(--font-head);text-transform:uppercase;letter-spacing:.02em;line-height:1.1;margin:0 0 .5em}
    p{margin:0 0 1em}
    .muted{color:var(--muted)}.small{font-size:.85rem}
    .gate{position:fixed;inset:0;z-index:100;background:#0a0a0a;display:flex;align-items:center;justify-content:center;padding:12px}
    .gate-panel{width:100%;max-width:720px;max-height:100%;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
    .gate-logo{height:56px;width:auto;margin:0 0 14px -4px}
    .gate-head h1{font-size:1.7rem}
    .legal-box{flex:1 1 auto;min-height:140px;overflow-y:auto;padding:14px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);font-size:.92rem;color:#d8d8d8;scrollbar-width:thin;scrollbar-color:var(--accent) #1a1a1a}
    .legal-box h2{font-size:1.4rem;color:var(--accent);margin-top:8px}
    .legal-box h3{font-size:1.05rem;margin-top:14px}
    .check{display:flex;gap:10px;align-items:flex-start;margin:12px 0;cursor:pointer;font-size:.92rem}
    .check input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent);flex:none}
    .btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 20px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:var(--radius);font-family:var(--font-head);font-weight:700;font-size:1.05rem;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
    .btn:disabled{opacity:.4;cursor:not-allowed}.btn-block{width:100%}
    #app{min-height:100vh}
    @keyframes gateIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
    .gate-panel{animation:gateIn .35s ease both}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="gated">

  <!-- Bloqueio obrigatório: Termos de Uso e Política de Privacidade -->
  <div id="gate" class="gate" role="dialog" aria-modal="true" aria-labelledby="gate-title" hidden>
    <div class="gate-panel">
      <div class="gate-head">
        <img class="gate-logo" src="logo-arena.png" alt="Arena" width="640" height="243">
        <h1 id="gate-title">Termos de Uso e Política de Privacidade</h1>
        <p class="muted">Para acessar a loja, leia os dois documentos abaixo até o final e confirme o aceite.</p>
      </div>
      <div id="gate-legal" class="legal-box" tabindex="0" aria-label="Termos de Uso e Política de Privacidade"></div>
      <p id="gate-hint" class="muted small">Role o texto até o fim para liberar a caixa de aceite.</p>
      <label class="check">
        <input type="checkbox" id="gate-check" disabled>
        <span>Li e aceito os Termos de Uso e a Política de Privacidade da Arena.</span>
      </label>
      <button type="button" id="gate-enter" class="btn btn-block" disabled>Concordar e Acessar</button>
    </div>
  </div>

  <div id="app" inert>
    <header class="site-header">
      <div class="container header-row">
        <a href="#" class="logo-link" aria-label="Arena, página inicial"><img src="logo-arena.png" alt="Arena" width="640" height="243"></a>
        <div class="header-actions">
          <a id="admin-link" href="#admin" class="header-link" hidden>Painel</a>
          <button type="button" class="header-btn" data-act="account" aria-label="Minha conta">
            <span data-bind="icon-user"></span>
            <span id="account-label" class="header-label">Entrar</span>
          </button>
          <button type="button" class="header-btn" data-act="open-cart" aria-label="Abrir carrinho">
            <span data-bind="icon-cart"></span>
            <span id="cart-badge" class="cart-badge" hidden>0</span>
          </button>
        </div>
      </div>
    </header>

    <main id="view"></main>

    <footer class="site-footer">
      <div class="container footer-row">
        <img class="footer-logo" src="logo-arena.png" alt="Arena" width="640" height="243">
        <p class="muted small">Moda fitness para treino e competição.</p>
        <div class="footer-links">
          <button type="button" class="link" data-act="legal">Termos de Uso</button>
          <button type="button" class="link" data-act="legal">Política de Privacidade</button>
        </div>
      </div>
    </footer>
  </div>

  <div id="cart-backdrop" class="backdrop" data-act="close-cart" hidden></div>
  <aside id="cart" class="drawer" aria-label="Carrinho de compras" inert>
    <div class="drawer-head">
      <h2>Carrinho</h2>
      <button type="button" class="icon-btn" data-act="close-cart" aria-label="Fechar carrinho"><span data-bind="icon-close"></span></button>
    </div>
    <div id="cart-body" class="drawer-body"></div>
    <div id="cart-foot" class="drawer-foot"></div>
  </aside>

  <div id="modal-root" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <template id="tpl-legal">
    <section>
      <h2>Termos de Uso</h2>
      <h3>1. Aceitação</h3>
      <p>Ao acessar e utilizar a loja virtual Arena, você declara ter lido e concordado com estes Termos de Uso. Caso não concorde, não utilize o site.</p>
      <h3>2. Cadastro</h3>
      <p>A navegação e a montagem do carrinho não exigem cadastro. Para finalizar um pedido é necessário criar uma conta com informações verdadeiras e atualizadas. Você é responsável por manter a confidencialidade da sua senha e por toda atividade realizada na sua conta.</p>
      <h3>3. Produtos e preços</h3>
      <p>As imagens e descrições dos produtos buscam representar o item com fidelidade, mas pequenas variações de cor podem ocorrer conforme a tela do dispositivo. Os preços e as promoções podem ser alterados a qualquer momento, sendo válido o preço exibido no momento do registro do pedido. A disponibilidade depende do estoque de cada tamanho e cor.</p>
      <h3>4. Pedidos e pagamento</h3>
      <p>Ao concluir a compra, o pedido é registrado com o status "Aguardando Pagamento". O pagamento e a confirmação são combinados diretamente com a loja pelos canais de atendimento informados. O pedido só segue para separação e envio após essa confirmação.</p>
      <h3>5. Cupons</h3>
      <p>Cupons de desconto possuem percentual, escopo (carrinho inteiro ou categoria específica) e limite de usos por conta definidos pela Arena. Cupons de categoria incidem apenas sobre os produtos elegíveis. É vedada a tentativa de burlar as regras de uso dos cupons.</p>
      <h3>6. Entrega</h3>
      <p>O valor do frete é calculado conforme a região ou faixa de distância selecionada. Compras que atingirem a meta de frete grátis vigente na loja ficam isentas da taxa de envio. Os prazos informados são estimativas e podem variar.</p>
      <h3>7. Trocas, devoluções e arrependimento</h3>
      <p>Nas compras realizadas à distância, você pode desistir da compra em até 7 dias corridos após o recebimento, nos termos do Código de Defesa do Consumidor. Trocas por tamanho ou defeito seguem a mesma legislação e devem ser solicitadas pelos canais de atendimento da loja.</p>
      <h3>8. Propriedade intelectual</h3>
      <p>A marca Arena, o layout, os textos e as imagens do site são protegidos por direitos autorais e não podem ser copiados ou reutilizados sem autorização.</p>
      <h3>9. Alterações</h3>
      <p>Estes Termos podem ser atualizados. A versão vigente é sempre a publicada no site, e o uso continuado após a atualização indica concordância com o novo texto.</p>
    </section>
    <section>
      <h2>Política de Privacidade</h2>
      <h3>1. Dados que coletamos</h3>
      <p>Coletamos os dados que você informa ao criar conta e ao finalizar um pedido: nome completo, e-mail, telefone e endereço de entrega. Também registramos o histórico dos seus pedidos, o uso de cupons e a data e hora do aceite destes documentos. Guardamos no seu navegador (localStorage) o aceite dos termos e o conteúdo do carrinho.</p>
      <h3>2. Finalidade</h3>
      <p>Usamos os dados para criar e manter sua conta, processar e entregar pedidos, aplicar cupons, prestar atendimento e cumprir obrigações legais. Não vendemos seus dados.</p>
      <h3>3. Base legal</h3>
      <p>O tratamento ocorre com base na execução de contrato, no cumprimento de obrigação legal e no seu consentimento, conforme a Lei Geral de Proteção de Dados (Lei 13.709/2018).</p>
      <h3>4. Armazenamento e compartilhamento</h3>
      <p>Os dados são armazenados em serviços de nuvem do Google Firebase (autenticação e banco de dados). Compartilhamos informações apenas com quem for necessário para concluir a entrega do pedido ou quando houver exigência legal.</p>
      <h3>5. Seus direitos</h3>
      <p>Você pode solicitar confirmação de tratamento, acesso, correção, anonimização, portabilidade, eliminação dos dados e revogação do consentimento, nos termos do artigo 18 da LGPD, pelos canais de atendimento da loja.</p>
      <h3>6. Segurança</h3>
      <p>Adotamos medidas técnicas para proteger seus dados, incluindo autenticação, regras de acesso ao banco de dados e conexão criptografada. Nenhum sistema é totalmente imune a incidentes, e em caso de ocorrência relevante você será informado conforme a lei.</p>
      <h3>7. Retenção</h3>
      <p>Mantemos os dados pelo tempo necessário para cumprir as finalidades acima e as obrigações legais e fiscais aplicáveis.</p>
    </section>
  </template>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="app.js"></script>
</body>
</html>
